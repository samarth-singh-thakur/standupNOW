<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Timeline Test</title>
    <link rel="stylesheet" href="src/css/styles.css">
</head>
<body>
    <div class="container">
        <div class="root-container">
            <div class="recent-entries">
                <div class="entries-list">
                    <!-- Timeline Item 1 -->
                    <div class="timeline-item">
                        <div class="timeline-bullet"></div>
                        <div class="entry-card">
                            <div class="entry-time">Today, 11:35 PM</div>
                            <div class="entry-content">I made this feature</div>
                        </div>
                    </div>
                    
                    <!-- Timeline Connector -->
                    <div class="timeline-connector">
                        <div class="timeline-time">+4m</div>
                    </div>
                    
                    <!-- Timeline Item 2 -->
                    <div class="timeline-item">
                        <div class="timeline-bullet"></div>
                        <div class="entry-card">
                            <div class="entry-time">Today, 11:31 PM</div>
                            <div class="entry-content">Testing the timeline</div>
                        </div>
                    </div>
                    
                    <!-- Timeline Connector -->
                    <div class="timeline-connector">
                        <div class="timeline-time">+6m</div>
                    </div>
                    
                    <!-- Timeline Item 3 -->
                    <div class="timeline-item">
                        <div class="timeline-bullet"></div>
                        <div class="entry-card">
                            <div class="entry-time">Today, 11:25 PM</div>
                            <div class="entry-content">Another entry here</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
