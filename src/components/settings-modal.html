<!-- Settings Modal Component -->
<div class="modal-overlay" id="settingsModalOverlay">
    <div class="modal-container settings-modal">
        <div class="modal-header">
            <h2 class="modal-title">Settings</h2>
            <button class="modal-close" id="settingsModalClose">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
        </div>

        <div class="modal-body">
            <!-- Timer Settings Section -->
            <div class="settings-section">
                <h3 class="settings-section-title">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="2" fill="none"/>
                        <path d="M10 6V10L13 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    Timer Interval
                </h3>
                <p class="settings-description">
                    Set how often you want to be reminded to add standup updates
                </p>

                <!-- Quick Presets -->
                <div class="timer-presets">
                    <button class="preset-btn" data-minutes="15">15 min</button>
                    <button class="preset-btn" data-minutes="30">30 min</button>
                    <button class="preset-btn active" data-minutes="60">1 hour</button>
                    <button class="preset-btn" data-minutes="120">2 hours</button>
                </div>

                <!-- Custom Timer Input -->
                <div class="custom-timer-section">
                    <label class="custom-timer-label">
                        <span>Custom interval</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="customTimerToggle" class="toggle-input">
                            <span class="toggle-slider"></span>
                        </label>
                    </label>

                    <div class="custom-timer-inputs" id="customTimerInputs" style="display: none;">
                        <div class="timer-input-group">
                            <input type="number" id="timerDays" min="0" max="365" value="0" class="timer-input">
                            <label class="timer-input-label">Days</label>
                        </div>
                        <div class="timer-input-group">
                            <input type="number" id="timerHours" min="0" max="23" value="0" class="timer-input">
                            <label class="timer-input-label">Hours</label>
                        </div>
                        <div class="timer-input-group">
                            <input type="number" id="timerMinutes" min="1" max="59" value="60" class="timer-input">
                            <label class="timer-input-label">Minutes</label>
                        </div>
                    </div>

                    <div class="timer-preview" id="timerPreview">
                        Current interval: <strong>60 minutes</strong>
                    </div>
                </div>
            </div>

            <!-- Data Management Section -->
            <div class="settings-section">
                <h3 class="settings-section-title">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 6H16M4 10H16M4 14H10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    Data Management
                </h3>
                <p class="settings-description">
                    Manage your standup entries and app data
                </p>

                <div class="settings-actions">
                    <button class="settings-action-btn" id="exportEntriesBtn">
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M9 2V10M9 2L6 5M9 2L12 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M3 12V14C3 15.1 3.9 16 5 16H13C14.1 16 15 15.1 15 14V12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                        Export Entries
                    </button>
                    <button class="settings-action-btn" id="importEntriesBtn">
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M9 10V2M9 10L6 7M9 10L12 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M3 12V14C3 15.1 3.9 16 5 16H13C14.1 16 15 15.1 15 14V12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                        Import Entries
                    </button>
                    <button class="settings-action-btn danger" id="clearAllEntriesBtn">
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M3 5H15M7 8V13M11 8V13M4 5L5 15C5 15.5 5.5 16 6 16H12C12.5 16 13 15.5 13 15L14 5M7 5V3C7 2.5 7.5 2 8 2H10C10.5 2 11 2.5 11 3V5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                        Clear All Entries
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
