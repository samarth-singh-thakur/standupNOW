<svg width="420" height="120" viewBox="0 0 420 120" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="textGlow" x1="0" y1="0" x2="320" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF200"/>
      <stop offset="50%" stop-color="#FFD400"/>
      <stop offset="100%" stop-color="#FFF200"/>
      <animateTransform
        attributeName="gradientTransform"
        type="translate"
        values="-80 0; 80 0; -80 0"
        dur="4s"
        repeatCount="indefinite"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="revealText">
      <rect x="0" y="0" width="0" height="56">
        <animate attributeName="width" from="0" to="320" dur="1s" fill="freeze"/>
      </rect>
    </clipPath>

    <style>
      .person-stroke {
        stroke: #FFF200;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .seat {
        stroke: #6b7280;
        stroke-width: 3;
        stroke-linecap: round;
        opacity: 0.5;
      }
    </style>
  </defs>

  <!-- Text block -->
  <g clip-path="url(#revealText)" transform="translate(0,8)">
    <text
      x="0"
      y="38"
      font-family="Inter, Arial, sans-serif"
      font-size="28"
      font-weight="800"
      letter-spacing="0.2px"
      fill="url(#textGlow)"
      filter="url(#softGlow)">
      StandupNOW
    </text>

    <rect x="1" y="46" width="0" height="2.5" rx="1.25" fill="#FFF200" opacity="0.95">
      <animate attributeName="width" from="0" to="168" dur="0.9s" begin="0.25s" fill="freeze"/>
    </rect>

    <rect x="-50" y="8" width="36" height="36" fill="white" opacity="0.08" transform="skewX(-20)">
      <animate attributeName="x" from="-50" to="250" dur="2.8s" begin="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Person block -->
  <g transform="translate(300,0) scale(0.9)">
    <!-- chair -->
    <line class="seat" x1="22" y1="82" x2="50" y2="82"/>
    <line class="seat" x1="28" y1="82" x2="28" y2="98"/>
    <line class="seat" x1="46" y1="82" x2="46" y2="98"/>
    <line class="seat" x1="22" y1="82" x2="22" y2="62"/>

    <!-- head -->
    <circle class="person-stroke" cx="48" cy="38" r="8">
      <animate attributeName="cx" values="48;48;50;52;54;56" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="38;38;36;33;29;24" dur="1.4s" repeatCount="indefinite"/>
    </circle>

    <!-- body -->
    <line class="person-stroke" x1="48" y1="46" x2="48" y2="66">
      <animate attributeName="x1" values="48;48;50;52;54;56" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="46;46;44;41;37;32" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="48;48;50;52;54;56" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="66;66;65;63;61;58" dur="1.4s" repeatCount="indefinite"/>
    </line>

    <!-- left arm -->
    <line class="person-stroke" x1="48" y1="52" x2="37" y2="64">
      <animate attributeName="x1" values="48;48;50;52;54;56" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="52;52;50;47;43;40" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="37;37;40;43;45;47" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="64;64;61;56;50;46" dur="1.4s" repeatCount="indefinite"/>
    </line>

    <!-- right arm -->
    <line class="person-stroke" x1="48" y1="52" x2="60" y2="64">
      <animate attributeName="x1" values="48;48;50;52;54;56" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="52;52;50;47;43;40" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="60;60;63;66;68;70" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="64;64;60;54;47;42" dur="1.4s" repeatCount="indefinite"/>
    </line>

    <!-- left leg -->
    <line class="person-stroke" x1="48" y1="66" x2="38" y2="82">
      <animate attributeName="x1" values="48;48;50;52;54;56" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="66;66;65;63;61;58" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="38;38;40;43;46;49" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="82;82;84;86;90;94" dur="1.4s" repeatCount="indefinite"/>
    </line>

    <!-- right leg -->
    <line class="person-stroke" x1="48" y1="66" x2="60" y2="82">
      <animate attributeName="x1" values="48;48;50;52;54;56" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="66;66;65;63;61;58" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="60;60;61;62;63;64" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="82;82;85;88;91;94" dur="1.4s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>

